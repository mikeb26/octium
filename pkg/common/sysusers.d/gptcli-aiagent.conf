# gptcli aiagent sandbox user + shared group
# Installed by packaging into: /usr/lib/sysusers.d/gptcli-aiagent.conf
#
# Type Name         ID  GECOS                    Home          Shell

g gptcli-share -

# Create a system user named "aiagent" with home directory /home/aiagent.
# Explicitly set the shell to nologin.
u aiagent - "gptcli sandbox execution user" /home/aiagent /usr/sbin/nologin

# Add aiagent to the shared group used for workspace access and systemd-run permissions.
m aiagent gptcli-share
