# https://circleci.com/docs/2.0/configuration-reference
version: 2.1

# https://circleci.com/docs/2.0/configuration-reference/#jobs
jobs:
  build:
    working_directory: ~/repo
    # https://circleci.com/docs/2.0/configuration-reference/#docker-machine-macos-windows-executor
    docker:
      - image: cimg/go:1.26.2
    # https://circleci.com/docs/2.0/configuration-reference/#steps
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-v4-{{ checksum "go.sum" }}
      - run:
          name: Install Dependencies
          command: make vendor
      - run:
          name: Install ncurses
          command: |
              sudo apt-get update
              sudo apt-get install -y libncurses-dev

      - run:
          name: Install Debian/RedHat packaging dependencies
          command: |
              if [ "$CIRCLE_TAG" != "" ]
              then
                  sudo apt-get update
                  sudo apt-get install -y \
                    devscripts \
                    debhelper \
                    debhelper-compat \
                    dpkg-dev \
                    fakeroot \
                    build-essential \
                    git \
                    make \
                    pkg-config \
                    ca-certificates \
                    ncurses-bin \
                    libncurses-dev \
                    rpm
              else
                  echo "Not a tagged release; skipping Debian packaging dependencies"
              fi
      - save_cache:
          key: go-mod-v4-{{ checksum "go.sum" }}
          paths:
            - "/go/pkg/mod"
      - run:
          name: Build
          command: |
            if [ "$CIRCLE_TAG" != "" ]
            then
                rm cmd/noctium/version.txt
                make cmd/noctium/version.txt
            fi          
            make build

            mkdir -p dist
            cp noctium dist/

            if [ "$CIRCLE_TAG" != "" ]
            then
                make deb
                make rpm
                cp /tmp/octium_*.deb dist/
                cp /tmp/octium-*.rpm dist/
                # dbgsym packages are emitted as .ddeb (Debian debug symbol packages)
                cp /tmp/octium-dbgsym_*.ddeb dist/
            fi
      - run:
          name: Install mockgen
          command: |
              mkdir -p $HOME/go/bin
              go install github.com/golang/mock/mockgen@latest
      - run:
          name: Run tests
          command: |
            PATH=$PATH:$HOME/go/bin
            make unit-tests.xml
      - store_test_results:
          path: unit-tests.xml
      - store_artifacts:
          path: dist
      - run:
          name: Github release
          command: |
            go install github.com/tcnksm/ghr@latest
            PATH=$PATH:$HOME/go/bin
            if [ "$CIRCLE_TAG" != "" ]
            then
                ghr -name "octium ($CIRCLE_TAG)" $CIRCLE_TAG dist
            else
                echo "Not releasing untagged commit"
            fi

# https://circleci.com/docs/2.0/configuration-reference/#workflows
workflows:
  version: 2
  build-and-release:
    jobs:
      - build:
          context:
            - global
          filters:
            tags:
              only: /^v.*/
            branches:
              only: main
